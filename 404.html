<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Page introuvable | FootLive Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#070b16">
<link rel="icon" href="/favicon.ico">
<style>
:root{--bg:#070b16;--fg:#eaf0ff;--muted:#9fb0d0;--accent:#2f7bff;--card:#111a30}
@media (prefers-color-scheme: light){:root{--bg:#f4f7ff;--fg:#0b1530;--muted:#51608a;--card:#fff}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:440px;width:100%;text-align:center;background:var(--card);border-radius:18px;padding:32px 24px}
.code{font-size:64px;font-weight:800;color:var(--accent);line-height:1}
h1{font-size:22px;margin:12px 0 8px}
p{color:var(--muted);margin:0 0 20px;line-height:1.5}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a{display:inline-block;padding:11px 18px;border-radius:10px;text-decoration:none;font-weight:600;background:var(--accent);color:#fff}
a.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
</style>
</head>
<body>
<main>
<div class="code">404</div>
<h1>Cette page n’existe pas</h1>
<p>Le lien est peut-être erroné ou la page a été déplacée. Retrouve les scores en direct depuis l’accueil.</p>
<div class="btns">
<a href="/">Retour à l’accueil</a>
<a class="alt" href="/classements.html">Classements</a>
</div>
</main>
</body>
</html>
