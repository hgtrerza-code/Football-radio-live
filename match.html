.wrap{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}

.tm{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:.9rem;min-width:0}

.sc{font-size:2.4rem;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums}
.st{margin-top:6px;font-size:.8rem;font-weight:700;color:var(--mut)}
.st.live{color:var(--red)}.badge{display:inline-block;background:var(--red);color:#fff;border-radius:6px;padding:1px 6px;font-size:.65rem;margin-right:6px;letter-spacing:.5px}
.fav{background:none;border:0;color:var(--mut);font-size:1.1rem;cursor:pointer}.fav.on{color:#facc15}
.tabs{display:flex;gap:6px;margin:14px 0 10px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;background:var(--card);border:1px solid var(--border);color:var(--mut);border-radius:999px;padding:8px 14px;font:700 .78rem inherit;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:#04210f;border-color:var(--acc)}
.box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
.box h3{margin:0 0 10px;font-size:.72rem;letter-spacing:1px;text-transform:uppercase;color:var(--mut)}
.ev{display:grid;grid-template-columns:44px 24px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.85rem}.ev:last-child{border:0}
.ev b{color:var(--acc)}.ev small{color:var(--mut)}
.bar{margin:10px 0}.bar .l{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:4px}.bar .l span:nth-child(2){color:var(--mut)}
.bar .t{display:flex;height:6px;border-radius:4px;overflow:hidden;background:var(--card2);gap:2px}.bar .t i{display:block;background:#3b82f6}.bar .t i+i{background:var(--acc)}
.lu{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lu h4{margin:0 0 6px;font-size:.8rem}.lu div div{font-size:.8rem;padding:3px 0;color:#dbe4f3}.lu em{color:var(--mut);font-style:normal;display:inline-block;width:22px}
.cm div{font-size:.82rem;padding:6px 0;border-bottom:1px solid var(--border);color:#cbd5e5}.cm b{color:var(--acc);margin-right:6px}
.empty,.err{color:var(--mut);text-align:center;padding:20px 8px;font-size:.88rem}
.info{font-size:.8rem;color:var(--mut);line-height:1.6}
[dir=rtl] .ev{direction:rtl}
</style>
</head>
