name: Aperçu des matchs du jour

on:
  schedule:
    - cron: "5 */2 * * *"   # toutes les 2 h (UTC)
  workflow_dispatch:         # lancement manuel possible

permissions:
  contents: write

concurrency:
  group: apercu-matchs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer l'aperçu
        run: node scripts/update-apercu.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pages indexables par match + sitemap-matchs.xml + IndexNow
        run: python3 scripts/generate_match_pages.py --ping
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html matchs-du-jour.json matchs matchs-du-jour.html sitemap-matchs.xml en es it nl de ar
          echo "== Fichiers modifiés non ajoutés :"; git status --short | grep -v '^[AMDR] ' || echo "aucun"
          if ! git diff --cached --quiet; then
            git commit -m "Aperçu des matchs du jour"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
