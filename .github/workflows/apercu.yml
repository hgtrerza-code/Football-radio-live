name: Aperçu pages compétitions

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apercu-competitions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer les aperçus
        run: python3 scripts/generate_apercu.py
      - name: Commit si changement
        run: |
          if git diff --quiet; then echo "Aucun changement"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aperçu matchs (auto)"
          git pull --rebase
          git push
